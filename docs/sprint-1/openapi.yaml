openapi: 3.1.0
info:
  title: SmartSweep API
  version: 0.1.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: Register a new citizen account
      description: 'Register a new citizen account.


        Public self-registration is restricted to Citizens only.

        Crew members are onboarded and provisioned directly by Administrators

        via the operational management portal.'
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Authenticate user and issue JWT access and refresh tokens
      description: Authenticate user with email and password.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh access token using valid refresh token
      description: Issue new token pair using a valid refresh token.
      operationId: refresh_token_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Get profile of current logged-in user
      description: Return currently authenticated user details.
      operationId: get_me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
      security:
      - HTTPBearer: []
  /api/v1/auth/admin-only:
    get:
      tags:
      - Auth
      summary: Admin-restricted endpoint for role authorization checks
      description: Endpoint accessible only by Admin role.
      operationId: admin_only_check_api_v1_auth_admin_only_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Admin Only Check Api V1 Auth Admin Only Get
      security:
      - HTTPBearer: []
  /api/v1/auth/crew-only:
