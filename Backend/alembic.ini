# Alembic configuration.
#
# Note what is deliberately ABSENT: `sqlalchemy.url`. Alembic's default template
# puts the connection string here, which would mean committing credentials to
# git and having no way to point at a different database per environment.
# Instead `app/db/migrations/env.py` reads it from `Settings` — the same source
# the application uses, so `alembic upgrade head` and the running app can never
# disagree about which database they mean.
#
# Usage:
#   uv run alembic revision --autogenerate -m "0001 sprint 1 tables"
#   uv run alembic upgrade head
#   uv run alembic downgrade -1
#   uv run alembic current

[alembic]
script_location = app/db/migrations

# Put Backend/ on sys.path so env.py can `import app`. Required because the
# alembic console script does not add the working directory itself, and this
# project is not pip-installed into the venv (no [build-system] — uv treats it
# as a virtual project). Without this line every alembic command fails with
# ModuleNotFoundError: No module named 'app'.
prepend_sys_path = .

# Zero-padded, ordered filenames: 0001_sprint_1_tables.py. The default is a
# random hex slug, which sorts meaninglessly in a directory listing and makes
# review order impossible to see at a glance.
file_template = %%(rev)s_%%(slug)s

# `path_separator` replaces the deprecated `version_path_separator` (Alembic 1.14+).
path_separator = os

# Timestamps in migrations are UTC, matching plan assumption 8.
timezone = UTC

# ---------------------------------------------------------------------------
# Logging — Alembic reads this section via fileConfig(). Kept minimal; the
# application's own logging is configured in app/core/logging.py.
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
